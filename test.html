<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
<!--  <link rel="stylesheet" href="./test.css">-->
  <link rel="stylesheet" href="./assets/taoism.css">
  <style>
    /* 加载圆圈 */
    .loading-circle {
      width: 24px;
      height: 24px;
      border: 2px solid #eee;
      border-top-color: #409eff; /* 转动高亮色 */
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* 旋转关键帧 */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    input {
      appearance: none;
    }

    .loading svg {
      animation: loading-spinner 0.6s linear infinite;
    }

  </style>
</head>
<body>
<div>
  <div class="loading-circle"></div>

  <input type="date">

  <button class="tg-button tg-button-primary">

    </i>
